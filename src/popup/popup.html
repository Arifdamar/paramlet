<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="section-head">
      <span data-i18n="parameters"></span>
      <span class="badge" id="count"></span>
      <span class="spacer"></span>
      <button type="button" class="link" id="remove-tracking" data-i18n-title="removeTrackingTitle" hidden></button>
      <button type="button" class="icon-button" id="settings" data-i18n-title="settings" data-i18n-aria-label="settings">⚙</button>
    </header>
    <div class="search-bar" id="search-bar" hidden>
      <input
        type="search"
        id="search"
        spellcheck="false"
        autocomplete="off"
        data-i18n-placeholder="searchPopup"
        data-i18n-aria-label="searchPopup"
      />
    </div>
    <p class="empty" id="empty" data-i18n="noParameters" hidden></p>
    <p class="empty" id="no-matches" data-i18n="noMatches" hidden></p>
    <div class="rows" id="rows"></div>

    <section class="fragment" id="fragment" hidden>
      <header class="section-head">
        <span data-i18n="fragmentParameters"></span>
        <span class="badge" id="fragment-count"></span>
        <span class="detail" id="fragment-prefix"></span>
      </header>
      <div class="rows" id="fragment-rows"></div>
    </section>

    <section id="presets" hidden>
      <header class="section-head">
        <span data-i18n="presets"></span>
        <span class="detail" id="site"></span>
      </header>
      <ol class="preset-list" id="preset-list"></ol>
    </section>

    <p class="status" id="status" role="status" hidden></p>

    <footer id="footer">
      <button type="button" class="link" id="add" data-i18n="addParameter"></button>
      <span class="spacer"></span>
      <button type="button" id="save-preset" data-i18n="savePreset"></button>
      <button type="button" id="copy" data-i18n="copyUrl"></button>
      <button type="button" class="primary" id="apply" data-i18n="apply" data-i18n-title="applyTitle" disabled></button>
    </footer>

    <form class="save-bar" id="save-form" hidden>
      <input
        type="text"
        id="preset-name"
        maxlength="40"
        spellcheck="false"
        autocomplete="off"
        data-i18n-placeholder="presetName"
        data-i18n-aria-label="presetName"
      />
      <label class="scope-toggle">
        <input type="checkbox" id="all-sites" />
        <span data-i18n="allSites"></span>
      </label>
      <button type="button" id="cancel-save" data-i18n="cancel"></button>
      <button type="submit" class="primary" id="confirm-save" data-i18n="save" disabled></button>
    </form>

    <template id="row-template">
      <div class="row">
        <input type="checkbox" class="pick" data-i18n-aria-label="includeInPreset" />
        <input class="key" spellcheck="false" autocomplete="off" data-i18n-aria-label="key" />
        <span class="equals">=</span>
        <input class="value" spellcheck="false" autocomplete="off" data-i18n-aria-label="value" />
        <button type="button" class="remove" data-i18n-title="removeParameter" data-i18n-aria-label="removeParameter">×</button>
      </div>
    </template>

    <template id="preset-template">
      <li class="preset">
        <button type="button" class="preset-apply">
          <kbd class="shortcut"></kbd>
          <span class="preset-name"></span>
          <span class="params-summary"></span>
          <span class="scope" data-i18n="allSitesTag" hidden></span>
          <span class="preset-active" data-i18n-title="alreadyOnPage">✓</span>
        </button>
        <button type="button" class="delete" data-i18n-title="deletePreset" data-i18n-aria-label="deletePreset">×</button>
      </li>
    </template>
  </body>
</html>
